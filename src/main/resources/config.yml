# Whether players need a permission to use emojis in chat and /emoji.
#   false = everyone can use emojis (default)
#   true  = only players with the node below can use them
permission:
  required: false
  node: "chatemoji.use"

emoji-style: "emojis"

messages:
  # Shown when permission.required is true and the player lacks the node. MiniMessage format.
  no-permission: "<red>You do not have permission to do that."

# Emoji name -> base64 player head texture (the "Value" field on minecraft-heads.com).
# Use them in chat as :name:. /emoji lists them in the order below.
emojis:
  smile: ""
  sad: ""
  sob: ""
  pensive: ""
  crimace: ""
  skull: ""
apple: